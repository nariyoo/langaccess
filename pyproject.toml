[build-system]
# PEP 639 is Final, and the `license = "MIT"` expression below needs a backend that understands it.
# Hatchling supports the SPDX expression and `license-files` from 1.27.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "langaccess"
dynamic = ["version"]
description = "Audit the language accessibility of a website in a headless browser, classifying the access provided per language as English only, machine translation, or site-authored text."
readme = "README.md"
license = "MIT"
# The code is MIT and one shipped file is not. `src/langaccess/data/lid.176.ftz` is fastText's
# lid.176 model, distributed by its authors under CC-BY-SA 3.0, and until 2026-08-07 the only
# licence text in the built metadata was the MIT LICENSE, so a wheel carried a CC-BY-SA file with
# no CC-BY-SA notice and no attribution line anywhere a packager reads. Both patterns are listed
# because naming `license-files` replaces hatchling's default, which was finding LICENSE on its
# own; drop it from the list and the MIT text leaves the distribution. Everything matched here is
# copied into `<dist-info>/licenses/`, which is where `pip` and the licence scanners look.
license-files = ["LICENSE", "LICENSES/*.txt"]
authors = [
    { name = "Nari Yoo", email = "nariyoo@umich.edu" },
]
# 3.10, not 3.9: the source itself parses and runs under 3.9 (checked by AST feature_version and
# by grep for every 3.10+ construct), but playwright raised its own floor to 3.10 at 1.61.0, so a
# 3.9 user silently resolves an older playwright nothing here was ever tested against, and 3.9
# reached end of life on 2025-10-31.
requires-python = ">=3.10"
keywords = ["language access", "multilingual", "website audit", "machine translation",
            "accessibility", "nonprofit", "immigration", "health equity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Sociology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    # No `License ::` classifier. `license = "MIT"` above is the PEP 639 SPDX expression, and it and
    # the classifier are mutually exclusive: a distribution carrying both is refused at upload. The
    # 0.1.0 built on 2026-08-07 carried both, and TestPyPI accepted it, so the rehearsal did not
    # catch what the real index would have. The licence is not lost by removing this line; it is in
    # `License-Expression: MIT` and in the two `License-File` entries of the built metadata.
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    # Both floors are the versions this package was measured on. An accuracy figure belongs to one
    # build, and a bare requirement gives that binding away at the other end of the pipe, because
    # the browser producing the text these rules read and the classifier naming the languages they
    # gate could resolve to any release ever published. The versions the figure was measured under
    # are playwright 1.60.0 and fasttext-predict 0.9.2.4. Each ceiling is the next major, the
    # boundary at which either project is free to change what its API returns.
    "playwright>=1.60,<2",
    # inference-only fastText wheels; the lid.176 model itself ships inside the package
    # (src/langaccess/data/lid.176.ftz, CC-BY-SA 3.0, credited in the README), used only for the
    # languages this package cannot express itself; see core.COVERED and the benchmark recorded
    # at core.FT_MIN_CONF.
    "fasttext-predict>=0.9.2.4,<1",
]

[project.urls]
Homepage = "https://github.com/nariyoo/langaccess"
Repository = "https://github.com/nariyoo/langaccess"
Issues = "https://github.com/nariyoo/langaccess/issues"

[project.scripts]
langaccess = "langaccess.cli:main"

[project.optional-dependencies]
test = ["pytest", "fastapi", "httpx"]
web = ["fastapi", "pydantic>=2", "uvicorn"]
# only `to_frame` needs it, and only when called, so it is an extra rather than a dependency
frame = ["pandas"]

# one source for the version: the literal in the package, so an installed copy and the source tree
# can never disagree about which version produced a reading
[tool.hatch.version]
path = "src/langaccess/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/langaccess"]

# An sdist is what somebody builds, installs and tests the package from, and hatchling's default is
# every file git does not ignore. `figures/` holds the system figure and the script that draws it,
# and it is INCLUDED: README.md is the packaged long description and opens with that image, so an
# sdist without it ships a README whose first element is broken. `web/` stays, because
# `tests/test_web.py` imports the app from it.
#
# The image still cannot render on the project page, where a relative path resolves against nothing.
# That needs an absolute address, which needs the repository to be public, and until it is the
# packaged README carries an image that resolves for a reader who unpacks the sdist and not for one
# reading PyPI.
[tool.hatch.build.targets.sdist]
exclude = []

[tool.pytest.ini_options]
markers = [
    "live: tests that launch a real browser and hit the network (skipped by default)",
]
addopts = "-m \"not live\""
# `pytest -q` at the root is the package suite and nothing else, so its count stays a signal that
# src/ has not moved.
testpaths = ["tests"]
